version: '3.8'

services:
  device-agent:
    container_name: workload-fleet-management-client
    image: ${workload_Fleet_Management_Client_IMAGE_REF:-ghcr.io/margo/margo.org/workload-fleet-management-client:latest}
    pull_policy: never  # Options: always, never, missing, build
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN   # Required for nsenter/setns into host namespaces (-m -u -i -n -p)
      - SYS_PTRACE  # Required to read /proc/1/ns/* handles (host PID namespace visibility checks)
      - SYS_CHROOT  # Required for nsenter mount-namespace reassociation on this host
      - SYS_RAWIO   # Required when pqos uses --iface=msr to access MSR devices
      # - SYS_NICE
      # - SYS_MODULE  # Required for modprobe msr (executed via host-namespace nsenter)
    security_opt:
      - apparmor=unconfined  # Required with SYS_PTRACE to allow opening /proc/1/ns/ipc on this host
    pid: "host"
    network_mode: "host"
    environment:
      HTTP_PROXY: &proxy_url ${HTTP_PROXY:-http://proxy-dmz.intel.com:912}
      HTTPS_PROXY: *proxy_url
      http_proxy: *proxy_url
      https_proxy: *proxy_url
      NO_PROXY: &no_proxy_list ${NO_PROXY:-localhost,127.0.0.1,si-docker.ir.intel.com,intel.com,.intel.com,.svc,.local,.internal,127.0.0.0/8,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,10.123.232.165,10.123.232.166,harbor.machine}
      no_proxy: *no_proxy_list
      SSL_CERT_FILE: /config/harbor.crt
    # Add log rotation configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Maximum size of each log file
        max-file: "3"        # Keep 3 rotated files (30MB total)
        compress: "true"     # Compress rotated logs (optional)
    volumes:
      # - /root/.kube/config:/root/.kube/config:ro # to manage kubernetes runtimes
      - /var/run/docker.sock:/var/run/docker.sock # to manage docker runtimes
      - /home/robot/rt-benchmark-compose-app:/rt-benchmark-compose-app:ro
      - /home/labrat/rt-benchmark-compose-app:/rt-benchmark-compose-app:ro
      - ./config/config.yaml:/config/config.yaml
      - ./config/capabilities.json:/config/capabilities.json
      - ./config/cpu-topology-agent.json:/config/cpu-topology-agent.json
      - ./config/device-private.key:/config/device-private.key
      - ./config/device-public.crt:/config/device-public.crt
      - ./config/device-ecdsa.key:/config/device-ecdsa.key
      - ./config/device-ecdsa.crt:/config/device-ecdsa.crt
      - ./config/ca-cert.pem:/config/ca-cert.pem
      - ./config/harbor.crt:/config/harbor.crt
      - ./data:/data
    restart: unless-stopped
    entrypoint: ["./device-agent"]
    command: ["-config", "config/config.yaml"]
