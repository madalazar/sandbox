apiVersion: margo.org/v1-alpha1
kind: ApplicationDescription
metadata:
  id: rt-benchmark-suite
  name: RT Benchmark Suite
  description: >
    Real-time benchmarking suite combining the Caterpillar latency benchmark and
    the stress-ng CPU/memory stressor. Caterpillar measures scheduling latency on
    an isolated performance core while stress-ng generates background workload on
    a separate core to simulate real-world contention.
  version: 1.0.0
  catalog:
    application:
      icon: ./resources/rt-benchmark-logo.png
      tagline: Real-time latency benchmarking with stress-ng background load
      descriptionFile: ./resources/description.md
      releaseNotes: ./resources/release-notes.md
      licenseFile: ./resources/license.md
      tags: ["benchmark", "real-time", "stress-testing", "performance", "caterpillar"]
    organization:
      - name: Industrial Edge Controls

deploymentProfiles:
  - type: helm.v3
    description: >
      Deploys Caterpillar (latency benchmark) and stress-ng (background stressor)
      as two independent Helm releases on the same edge device.
    components:
      - name: caterpillar
        properties:
          repository: oci://harbor.machine:8443/library/caterpillar-benchmark
          revision: 1.0.0
          wait: false
          timeout: 4h

      - name: stressng
        properties:
          repository: oci://harbor.machine:8443/library/stressng
          revision: 0.1.0
          wait: false
          timeout: 4h

    requiredResources:
      cpu:
        # Caterpillar needs one isolated performance core for accurate latency measurement
        - name: caterpillar
          cores: 1
          class: performance
          type: isolated
          architectures:
            - amd64
            - x86_64
        # stress-ng runs as a shared background stressor on a separate core
        - name: stressng
          cores: 1
          class: performance
          type: shared
          architectures:
            - amd64
            - x86_64
      memory: 1024Mi
      storage: 2Gi

parameters:
  # ── Caterpillar image ────────────────────────────────────────────────────────
  caterpillarImageRepository:
    value: "harbor.machine:8443/library/caterpillar"
    targets:
      - pointer: image.repository
        components: ["caterpillar"]

  caterpillarImageTag:
    value: "latest"
    targets:
      - pointer: image.tag
        components: ["caterpillar"]

  # ── Caterpillar benchmark settings ──────────────────────────────────────────
  # caterpillarCpuset:
  #   value: "3"
  #   targets:
  #     - pointer: caterpillar.cpuset
  #       components: ["caterpillar"]

  # caterpillarSamples:
  #   value: 7200
  #   targets:
  #     - pointer: caterpillar.samples
  #       components: ["caterpillar"]

  # caterpillarOutputHostPath:
  #   value: "/tmp/caterpillar-output"
  #   targets:
  #     - pointer: output.hostPath
  #       components: ["caterpillar"]

  # ── stress-ng image ──────────────────────────────────────────────────────────
  # stressngImageRepository:
  #   value: "ghcr.io/colinianking/stress-ng"
  #   targets:
  #     - pointer: image.repository
  #       components: ["stressng"]

  # stressngImageTag:
  #   value: "latest"
  #   targets:
  #     - pointer: image.tag
  #       components: ["stressng"]

  # ── stress-ng stressor settings ──────────────────────────────────────────────
  # stressngCpuset:
  #   value: "1"
  #   targets:
  #     - pointer: stressng.cpuset
  #       components: ["stressng"]

  # stressngCpuWorkers:
  #   value: 1
  #   targets:
  #     - pointer: stressng.cpuWorkers
  #       components: ["stressng"]

  # stressngMemcpy:
  #   value: 6
  #   targets:
  #     - pointer: stressng.memcpy
  #       components: ["stressng"]

  # stressngDuration:
  #   value: 1500
  #   targets:
  #     - pointer: stressng.duration
  #       components: ["stressng"]

configuration:
  sections:
    - name: Caterpillar — Container Image
      settings:
        - parameter: caterpillarImageRepository
          name: Image Repository
          description: OCI registry path for the Caterpillar container image
          schema: requiredText

        - parameter: caterpillarImageTag
          name: Image Tag
          description: Container image tag / version
          schema: requiredText

    - name: Caterpillar — Benchmark
      settings:
        - parameter: caterpillarCpuset
          name: CPU Set
          description: >
            CPU core(s) to pin the benchmark thread to via -c (e.g. "3", "1-3", "1,3").
            Leave empty to let the OS scheduler decide.
          schema: optionalText

        - parameter: caterpillarSamples
          name: Sample Count
          description: >
            Number of latency samples to collect.
            Approximately 200 ≈ 5 min, 7200 ≈ 3 hours.
          schema: positiveInteger

        - parameter: caterpillarOutputHostPath
          name: Output Host Path
          description: Host-side directory where benchmark result files are written
          schema: requiredText

    - name: stress-ng — Container Image
      settings:
        - parameter: stressngImageRepository
          name: Image Repository
          description: OCI registry path for the stress-ng container image
          schema: requiredText

        - parameter: stressngImageTag
          name: Image Tag
          description: Container image tag / version
          schema: requiredText

    - name: stress-ng — Stressor
      settings:
        - parameter: stressngCpuset
          name: CPU Set (taskset)
          description: >
            CPU core(s) for the stress-ng process via --taskset (e.g. "1", "0-1", "0,2").
            Leave empty to omit --taskset.
          schema: optionalText

        - parameter: stressngCpuWorkers
          name: CPU Stressor Workers
          description: Number of --cpu stressor worker threads
          schema: positiveInteger

        - parameter: stressngMemcpy
          name: Memcpy Stressor Workers
          description: Number of --memcpy stressor worker threads
          schema: positiveInteger

        - parameter: stressngDuration
          name: Duration (seconds)
          description: Total duration for the stress run passed to --timeout
          schema: positiveInteger

  schema:
    - name: requiredText
      dataType: string
      allowEmpty: false
      maxLength: 256

    - name: optionalText
      dataType: string
      allowEmpty: true
      maxLength: 256

    - name: positiveInteger
      dataType: integer
      allowEmpty: false
      minValue: 1
