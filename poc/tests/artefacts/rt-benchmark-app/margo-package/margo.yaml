apiVersion: margo.org/v1-alpha1
kind: ApplicationDescription
metadata:
  id: rt-benchmark-suite
  name: RT Benchmark Suite
  description: >
    Real-time benchmarking suite combining the Caterpillar and cyclictest latency
    benchmarks with the stress-ng CPU/memory stressor. Caterpillar and cyclictest
    measure scheduling latency on isolated performance cores while stress-ng
    generates background workload on a separate core to simulate real-world
    contention.
  version: 1.0.0
  catalog:
    application:
      icon: ./resources/rt-benchmark-logo.png
      tagline: Real-time latency benchmarking with cyclictest and stress-ng background load
      descriptionFile: ./resources/description.md
      releaseNotes: ./resources/release-notes.md
      licenseFile: ./resources/license.md
      tags: ["benchmark", "real-time", "stress-testing", "performance", "caterpillar", "cyclictest"]
    organization:
      - name: Industrial Edge Controls

deploymentProfiles:
  - type: helm.v3
    description: >
      Deploys Caterpillar and cyclictest latency benchmarks plus stress-ng as
      independent Helm releases on the same edge device.
    components:
      - name: caterpillar
        properties:
          repository: oci://harbor.machine:8443/library/caterpillar-benchmark
          revision: 1.0.0
          wait: false
          timeout: 4h

      - name: cyclictest
        properties:
          repository: oci://harbor.machine:8443/library/cyclictest
          revision: 0.1.0
          wait: false
          timeout: 4h

      - name: stressng
        properties:
          repository: oci://harbor.machine:8443/library/stressng
          revision: 0.1.0
          wait: false
          timeout: 4h

    requiredResources:
      cpu:
        # Caterpillar needs one isolated performance core for accurate latency measurement
        - name: caterpillar
          cores: 1
          class: performance
          type: isolated
          architectures:
            - amd64
            - x86_64
        # cyclictest also needs one isolated performance core for accurate latency measurement
        - name: cyclictest
          cores: 1
          class: performance
          type: isolated
          architectures:
            - amd64
            - x86_64
        # stress-ng runs as a shared background stressor on a separate core
        - name: stressng
          cores: 1
          class: performance
          type: shared
          architectures:
            - amd64
            - x86_64
      memory: 1024Mi
      storage: 2Gi

parameters:
  # ── Caterpillar image ────────────────────────────────────────────────────────
  caterpillarImageRepository:
    value: "harbor.machine:8443/library/caterpillar"
    targets:
      - pointer: image.repository
        components: ["caterpillar"]

  caterpillarImageTag:
    value: "latest"
    targets:
      - pointer: image.tag
        components: ["caterpillar"]

  # ── cyclictest image ────────────────────────────────────────────────────────
  cyclictestImageRepository:
    value: "harbor.machine:8443/library/cyclictest"
    targets:
      - pointer: image.repository
        components: ["cyclictest"]

  cyclictestImageTag:
    value: "latest"
    targets:
      - pointer: image.tag
        components: ["cyclictest"]

