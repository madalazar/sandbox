configuration:
  sections:
    - name: Caterpillar — Container Image
      settings:
        - parameter: caterpillarImageRepository
          name: Image Repository
          description: OCI registry path for the Caterpillar container image
          schema: requiredText

        - parameter: caterpillarImageTag
          name: Image Tag
          description: Container image tag / version
          schema: requiredText

    - name: Caterpillar — Benchmark
      settings:
        - parameter: caterpillarCpuset
          name: CPU Set
          description: >
            CPU core(s) to pin the benchmark thread to via -c (e.g. "3", "1-3", "1,3").
            Leave empty to let the OS scheduler decide.
          schema: optionalText

        - parameter: caterpillarSamples
          name: Sample Count
          description: >
            Number of latency samples to collect.
            Approximately 200 ≈ 5 min, 7200 ≈ 3 hours.
          schema: positiveInteger

        - parameter: caterpillarOutputHostPath
          name: Output Host Path
          description: Host-side directory where benchmark result files are written
          schema: requiredText

    - name: cyclictest — Container Image
      settings:
        - parameter: cyclictestImageRepository
          name: Image Repository
          description: OCI registry path for the cyclictest container image
          schema: requiredText

        - parameter: cyclictestImageTag
          name: Image Tag
          description: Container image tag / version
          schema: requiredText

    - name: cyclictest — Benchmark
      settings:
        - parameter: cyclictestCpuset
          name: CPU Set
          description: >
            CPU core(s) to pin cyclictest to via --test_core (e.g. "2", "1-3", "1,3").
            Leave empty to let the chart auto-select.
          schema: optionalText

        - parameter: cyclictestThreads
          name: Thread Count
          description: Number of cyclictest worker threads
          schema: positiveInteger

        - parameter: cyclictestPriority
          name: Priority
          description: Real-time priority used by cyclictest
          schema: positiveInteger

        - parameter: cyclictestInterval
          name: Interval (us)
          description: Sampling interval in microseconds
          schema: positiveInteger

        - parameter: cyclictestLoops
          name: Loops
          description: Number of cyclictest loops
          schema: positiveInteger

        - parameter: cyclictestHistogramMax
          name: Histogram Maximum
          description: Histogram bucket maximum in microseconds
          schema: positiveInteger

        - parameter: cyclictestCustom
          name: Extra Flags
          description: Additional flags passed directly to cyclictest
          schema: optionalText

        - parameter: cyclictestOutputHostPath
          name: Output Host Path
          description: Host-side directory where cyclictest log files are written
          schema: requiredText

    - name: stress-ng — Container Image
      settings:
        - parameter: stressngImageRepository
          name: Image Repository
          description: OCI registry path for the stress-ng container image
          schema: requiredText

        - parameter: stressngImageTag
          name: Image Tag
          description: Container image tag / version
          schema: requiredText

    - name: stress-ng — Stressor
      settings:
        - parameter: stressngCpuset
          name: CPU Set (taskset)
          description: >
            CPU core(s) for the stress-ng process via --taskset (e.g. "1", "0-1", "0,2").
            Leave empty to omit --taskset.
          schema: optionalText

        - parameter: stressngCpuWorkers
          name: CPU Stressor Workers
          description: Number of --cpu stressor worker threads
          schema: positiveInteger

        - parameter: stressngMemcpy
          name: Memcpy Stressor Workers
          description: Number of --memcpy stressor worker threads
          schema: positiveInteger

        - parameter: stressngDuration
          name: Duration (seconds)
          description: Total duration for the stress run passed to --timeout
          schema: positiveInteger

  schema:
    - name: requiredText
      dataType: string
      allowEmpty: false
      maxLength: 256

    - name: optionalText
      dataType: string
      allowEmpty: true
      maxLength: 256

    - name: positiveInteger
      dataType: integer
      allowEmpty: false
      minValue: 1
